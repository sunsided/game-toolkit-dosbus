[package]
name = "game-toolkit-dosbus"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "no_std clock, I/O port, IRQ and DMA interfaces shared by DOS-era PC hardware emulators"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/game-toolkit-dosbus"
homepage = "https://github.com/sunsided/game-toolkit-dosbus"
documentation = "https://docs.rs/game-toolkit-dosbus"
authors = ["Markus Mayer"]
keywords = ["dos", "emulation", "retro", "io-port", "no-std"]
categories = ["emulators", "game-development", "no-std"]
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[package.metadata.release]
pre-release-replacements = [
  # Turn the pending notes into the release's section and open a fresh [Unreleased] above it.
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  # Point [Unreleased] at the new tag and add a compare link for the release.
  { file = "CHANGELOG.md", search = "\\[Unreleased\\]: (\\S+)/compare/(\\S+)\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/compare/$2...{{tag_name}}", exactly = 1 },
]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
